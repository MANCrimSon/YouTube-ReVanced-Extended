name: Build Modules
on:
  workflow_call:
    inputs:
      from_ci:
        type: boolean
        required: false
        default: true

  workflow_dispatch:
    inputs:
      only_apps:
        description: "Comma-separated table names from config.toml to build (e.g. YouTube-Morphe). Leave empty to build everything."
        type: string
        required: false
        default: ""

jobs:
  run:
    permissions: write-all
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: "21"

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: true

      - name: Update config
        id: cfg
        if: ${{ inputs.from_ci }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # state.md is the persistent "what was last built with what" record
          # (see utils.sh state_upsert/config_update) - unlike build.md, which
          # is truncated and rewritten fresh every run, so it only ever
          # reflects the tables touched in that one run. No prior state.md
          # (first run ever) is handled by config_update() itself.
          git checkout origin/update -- state.md 2>/dev/null || :
          UPDATE_CFG=$(./build.sh config.toml --config-update)
          if [ "$UPDATE_CFG" ]; then
            echo "$UPDATE_CFG" > config.json
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          else
            # Ran and found nothing to do - distinct from this step not
            # having run at all (from_ci=false), which leaves should_build
            # unset and downstream steps default to building everything.
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Get next version code
        id: next_ver_code
        if: ${{ inputs.only_apps || steps.cfg.outputs.should_build != 'false' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=$(gh release list -L 1 | awk -F '\t' '{print $3}')
          if [ -z "$TAG" ]; then TAG=0; fi
          echo "NEXT_VER_CODE=$((TAG + 1))" >> $GITHUB_OUTPUT

      - name: Restore stock APK cache
        if: ${{ inputs.only_apps || steps.cfg.outputs.should_build != 'false' }}
        uses: actions/cache/restore@v4
        with:
          path: stock-apks
          key: stock-apks-${{ github.run_id }}
          restore-keys: |
            stock-apks-

      - name: Build modules/APKs
        if: ${{ inputs.only_apps || steps.cfg.outputs.should_build != 'false' }}
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 45
          max_attempts: 2
          retry_wait_seconds: 90
          command: |
            if [ -n "${ONLY_TABLES:-}" ]; then
              ./build.sh config.toml
            elif [ -f "config.json" ]; then
              ./build.sh config.json
            else
              ./build.sh config.toml
            fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: $GITHUB_REPOSITORY
          NEXT_VER_CODE: ${{ steps.next_ver_code.outputs.NEXT_VER_CODE }}
          ONLY_TABLES: ${{ inputs.only_apps }}

      # Runs even if "Build modules/APKs" itself failed (e.g. one table's
      # patches choke while others succeeded) so whatever did succeed still
      # gets persisted - only a cancelled run skips this.
      - name: Prune stale stock APKs from cache
        if: ${{ !cancelled() && (inputs.only_apps || steps.cfg.outputs.should_build != 'false') }}
        run: |
          # .manifest lines are "table: path", one per table, upserted by
          # build_rv() - never truncated, so a table not touched this run
          # still has its (still-current) entry from whenever it last built.
          if [ -f stock-apks/.manifest ]; then
            for f in stock-apks/*.apk; do
              [ -f "$f" ] || continue
              grep -qF ": ${f}" stock-apks/.manifest || { echo "Pruning stale $f"; rm -f "$f"; }
            done
          fi

      - name: Save stock APK cache
        if: ${{ !cancelled() && (inputs.only_apps || steps.cfg.outputs.should_build != 'false') }}
        uses: actions/cache/save@v4
        with:
          path: stock-apks
          key: stock-apks-${{ github.run_id }}

      - name: Get output
        id: get_output
        if: ${{ inputs.only_apps || steps.cfg.outputs.should_build != 'false' }}
        run: |
          DELIM="$(openssl rand -hex 8)"
          echo "BUILD_LOG<<${DELIM}" >> "$GITHUB_OUTPUT"
          cat build.md >> "$GITHUB_OUTPUT"
          echo "${DELIM}" >> "$GITHUB_OUTPUT"
          cp -f build.md build.tmp
          cp -f state.md state.tmp
      
      - name: Upload release
        if: ${{ inputs.only_apps || steps.cfg.outputs.should_build != 'false' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.next_ver_code.outputs.NEXT_VER_CODE }}
          BODY: ${{ steps.get_output.outputs.BUILD_LOG }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "Release" --notes "$BODY"
            gh release upload "$TAG" ./build/* --clobber
          else
            gh release create "$TAG" ./build/* --title "Release" --notes "$BODY"
          fi

      - name: Update README download links
        if: ${{ inputs.only_apps || steps.cfg.outputs.should_build != 'false' }}
        env:
          TAG: ${{ steps.next_ver_code.outputs.NEXT_VER_CODE }}
        run: |
          python3 - <<'PY'
          import glob
          import os
          import re

          tag = os.environ["TAG"]
          base = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/{tag}/"

          # marker -> (glob pattern relative to build/, link text or None to use the filename).
          # Only markers whose file was actually produced this run get touched; every
          # other app/arch keeps pointing at whatever release last built it.
          targets = {
              "yt-rvx-apk": ("youtube-revanced-extended-v*-all.apk", "Download"),
              "yt-rvx-zip": ("youtube-revanced-extended-module-v*-all.zip", "Download"),
              "ytm-rvx-apk-arm64": ("youtube-music-revanced-extended-v*-arm64-v8a.apk", "arm64-v8a"),
              "ytm-rvx-apk-armv7": ("youtube-music-revanced-extended-v*-arm-v7a.apk", "arm-v7a"),
              "ytm-rvx-zip-arm64": ("youtube-music-revanced-extended-module-v*-arm64-v8a.zip", "arm64-v8a"),
              "ytm-rvx-zip-armv7": ("youtube-music-revanced-extended-module-v*-arm-v7a.zip", "arm-v7a"),
              "yt-morphe-apk": ("youtube-morphe-v*-all.apk", "Download"),
              "yt-morphe-zip": ("youtube-morphe-module-v*-all.zip", "Download"),
              "ytm-morphe-apk-arm64": ("youtube-music-morphe-v*-arm64-v8a.apk", "arm64-v8a"),
              "ytm-morphe-apk-armv7": ("youtube-music-morphe-v*-arm-v7a.apk", "arm-v7a"),
              "ytm-morphe-zip-arm64": ("youtube-music-morphe-module-v*-arm64-v8a.zip", "arm64-v8a"),
              "ytm-morphe-zip-armv7": ("youtube-music-morphe-module-v*-arm-v7a.zip", "arm-v7a"),
          }

          with open("README.md", encoding="utf-8") as f:
              readme = f.read()

          changed = False
          for marker, (pattern, label) in targets.items():
              matches = glob.glob(os.path.join("build", pattern))
              if not matches:
                  continue
              name = os.path.basename(matches[0])
              link = f"[{label or name}]({base}{name})"
              new_readme, n = re.subn(
                  rf"(<!--{marker}-->).*?(<!--/{marker}-->)",
                  lambda m: m.group(1) + link + m.group(2),
                  readme,
                  flags=re.DOTALL,
              )
              if n and new_readme != readme:
                  readme = new_readme
                  changed = True

          if changed:
              with open("README.md", "w", encoding="utf-8") as f:
                  f.write(readme)
              print("README.md updated")
          else:
              print("No README changes needed")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          if ! git diff --cached --quiet; then
            git commit -m "Update README download links"
            git push origin HEAD:main
          else
            echo "no changes!"
          fi

      - name: Update modules changelog and update json
        id: update_config
        if: ${{ inputs.only_apps || steps.cfg.outputs.should_build != 'false' }}
        run: |
          git checkout -f update || git switch --discard-changes --orphan update
          cp -f build.tmp build.md
          cp -f state.tmp state.md
          get_update_json() {
            echo "{
            \"version\": \"$1\",
            \"versionCode\": ${{ steps.next_ver_code.outputs.NEXT_VER_CODE }},
            \"zipUrl\": \"$2\",
            \"changelog\": \"https://raw.githubusercontent.com/$GITHUB_REPOSITORY/update/build.md\"
          }"
          }

          cd build || { echo "build folder not found"; exit 1; }
          for OUTPUT in *module*.zip; do
            [ "$OUTPUT" = "*module*.zip" ] && continue
            ZIP_S=$(unzip -p "$OUTPUT" module.prop)
            if ! UPDATE_JSON=$(echo "$ZIP_S" | grep updateJson); then continue; fi
            UPDATE_JSON="${UPDATE_JSON##*/}"
            VER=$(echo "$ZIP_S" | grep version=)
            VER="${VER##*=}"
            DLURL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/${{ steps.next_ver_code.outputs.NEXT_VER_CODE }}/${OUTPUT}"
            get_update_json "$VER" "$DLURL" >"../$UPDATE_JSON"
          done
          cd ..

          find . -name "*-update.json" | grep . || : >dummy-update.json

      - name: Commit module json changes
        if: ${{ inputs.only_apps || steps.cfg.outputs.should_build != 'false' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      
          git add build.md state.md *-update.json
      
          if ! git diff --cached --quiet; then
            git commit -m "Bump version ${{ steps.next_ver_code.outputs.NEXT_VER_CODE }}"
            git push origin HEAD:update
          else
            echo "no changes!"
          fi

      - name: Report to Telegram
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
        if: env.TG_TOKEN != null && (inputs.only_apps || steps.cfg.outputs.should_build != 'false')
        run: |
          cd build || { echo "build folder not found"; exit 1; }

          TG_CHAT="@rvc_magisk"
          NL=$'\n'
          APKS=""
          MODULES=""
          for OUTPUT in *; do
            DL_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/${{ steps.next_ver_code.outputs.NEXT_VER_CODE }}/${OUTPUT}"
            if [[ $OUTPUT = *.apk ]]; then
              APKS+="${NL}📦[${OUTPUT}](${DL_URL})"
            elif [[ $OUTPUT = *.zip ]]; then
              MODULES+="${NL}📦[${OUTPUT}](${DL_URL})"
            fi
          done
          MODULES=${MODULES#"$NL"}
          APKS=${APKS#"$NL"}

          BODY="$(sed 's/^\* \*\*/↪ \*\*/g; s/^\* `/↪ \*\*/g; s/`/\*/g; s/^\* /\↪/g; s/\*\*/\*/g; s/###//g; s/^- /↪ /g; /^==/d;' ../build.md)"
          MSG="*New build!*

          ${BODY}

          *▼ Download Links:*
          Modules:
          ${MODULES}

          APKs:
          ${APKS}
          "
          echo "'$MSG'"
          MSG=${MSG:0:9450}
          POST="https://api.telegram.org/bot${TG_TOKEN}/sendMessage"
          curl -X POST --data-urlencode "parse_mode=Markdown" --data-urlencode "disable_web_page_preview=true" --data-urlencode "text=${MSG}" --data-urlencode "chat_id=${TG_CHAT}" "$POST"
