name: Build Modules

on:
  workflow_dispatch:
    inputs:
      only_apps:
        description: Comma separated list of apps to build. (youtube, youtube-music, ...)
        required: false
        type: string
  workflow_call:
    inputs:
      only_apps:
        description: Comma separated list of apps to build. (youtube, youtube-music, ...)
        required: false
        type: string

jobs:
  run:
    runs-on: ubuntu-latest
    permissions: write-all
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      FORCE_COLOR: 1
    steps:
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: "21"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update config
        id: cfg
        run: |
          git checkout -f update || git switch --discard-changes --orphan update
          if [ -f config.toml ]; then
            cp -f config.toml ../config.toml
          fi
          if [ -f state.md ]; then
            cp -f state.md ../state.md
          fi
          git checkout -f main

          # copy over config from update branch
          if [ -f ../config.toml ]; then
            cp -f ../config.toml config.toml
          fi
          if [ -f ../state.md ]; then
            cp -f ../state.md state.md
          fi

          chmod +x ./build.sh
          ./build.sh "${{ github.workspace }}/config.toml" --config-update
          if ! git diff --quiet config.toml || [ -n "${{ inputs.only_apps }}" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Get next version code
        id: next_ver_code
        if: ${{ inputs.only_apps || steps.cfg.outputs.should_build != 'false' }}
        run: |
          ver_code=$(gh api "repos/$GITHUB_REPOSITORY/releases" -q '.[0].tag_name' || echo 0)
          ver_code=$((ver_code + 1))
          echo "NEXT_VER_CODE=$ver_code" >> "$GITHUB_OUTPUT"

      - name: Restore stock APK cache
        if: ${{ inputs.only_apps || steps.cfg.outputs.should_build != 'false' }}
        uses: actions/cache/restore@v4
        with:
          path: stock-apks
          # Exact match by run_id (re-runs hit this), then fall back to the
          # latest stock-apks-* save from any previous run via restore-keys.
          key: stock-apks-${{ github.run_id }}
          restore-keys: stock-apks-

      - name: Build modules/APKs
        if: ${{ inputs.only_apps || steps.cfg.outputs.should_build != 'false' }}
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 60
          max_attempts: 2
          retry_on: error
          command: |
            export ONLY_TABLES="${{ inputs.only_apps }}"
            ./build.sh "${{ github.workspace }}/config.toml"

      # build_rv() upserts each successfully downloaded/used apk into
      # stock-apks/.manifest during build. Any cached apk NOT recorded there
      # (old versions no longer referenced after upstream bump) is safe to delete
      # so the GitHub Actions cache doesn't grow unbounded.
      #
      # Note: .manifest is seeded from state.md (which tracks every active build
      # target), so even if this run is a partial build (via ONLY_TABLES/only_apps),
      # the untouched tables' active stock APKs won't be pruned.
      - name: Prune stale stock APKs from cache
        if: ${{ always() && (inputs.only_apps || steps.cfg.outputs.should_build != 'false') }}
        run: |
          # Seed manifest from state.md if present, so any table not touched in
          # this run (partial build) still has its active stock APK protected from pruning
          if [ -f state.md ]; then
            while IFS= read -r line; do
              if [[ $line =~ ^([^:]+):[[:space:]]*([0-9][^[:space:]]*) ]]; then
                tbl="${BASH_REMATCH[1]}"
                ver="${BASH_REMATCH[2]}"
                if ! grep -qF "${tbl}: " stock-apks/.manifest 2>/dev/null; then
                  for f in stock-apks/*"${ver}"*.apk; do
                    [ -f "$f" ] && echo "${tbl}: ${f}" >> stock-apks/.manifest
                  done
                fi
              fi
            done < state.md
          fi

          if [ -f stock-apks/.manifest ]; then
            for f in stock-apks/*.apk; do
              [ -f "$f" ] || continue
              grep -qF ": ${f}" stock-apks/.manifest || { echo "Pruning stale $f"; rm -f "$f"; }
            done
          fi

      - name: Save stock APK cache
        if: ${{ always() && (inputs.only_apps || steps.cfg.outputs.should_build != 'false') }}
        uses: actions/cache/save@v4
        with:
          path: stock-apks
          # Unique key per run_id so save always creates a fresh cache entry
          # instead of skipping because the exact key already exists.
          key: stock-apks-${{ github.run_id }}

      - name: Get output
        id: out
        if: ${{ inputs.only_apps || steps.cfg.outputs.should_build != 'false' }}
        run: |
          OUTPUT=""
          for f in build/*; do
            OUTPUT+="${f} "
          done
          echo "OUTPUT=$OUTPUT" >> "$GITHUB_OUTPUT"

      - name: Upload release
        if: ${{ inputs.only_apps || steps.cfg.outputs.should_build != 'false' }}
        run: |
          # pre-releases are not marked as latest by default.
          # we have to do it manually.
          gh release create "${{ steps.next_ver_code.outputs.NEXT_VER_CODE }}" \
            --title "${{ steps.next_ver_code.outputs.NEXT_VER_CODE }}" \
            --notes-file "build.md" \
            --prerelease \
            --latest \
            ${{ steps.out.outputs.OUTPUT }}

      - name: Update README download links
        if: ${{ inputs.only_apps || steps.cfg.outputs.should_build != 'false' }}
        env:
          TAG: ${{ steps.next_ver_code.outputs.NEXT_VER_CODE }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import glob
          import json
          import os
          import re
          import urllib.request

          tag = os.environ["TAG"]
          base = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/{tag}/"

          # marker -> (glob pattern relative to build/, link text or None to use the filename).
          # Only markers whose file was actually produced this run get touched; every
          # other app/arch keeps pointing at whatever release last built it.
          targets = {
              "yt-rvx-apk": ("youtube-revanced-extended-v*-all.apk", "Download"),
              "yt-rvx-zip": ("youtube-revanced-extended-module-v*-all.zip", "Download"),
              "ytm-rvx-apk-arm64": ("youtube-music-revanced-extended-v*-arm64-v8a.apk", "arm64-v8a"),
              "ytm-rvx-apk-armv7": ("youtube-music-revanced-extended-v*-arm-v7a.apk", "arm-v7a"),
              "ytm-rvx-zip-arm64": ("youtube-music-revanced-extended-module-v*-arm64-v8a.zip", "arm64-v8a"),
              "ytm-rvx-zip-armv7": ("youtube-music-revanced-extended-module-v*-arm-v7a.zip", "arm-v7a"),
              "yt-morphe-apk": ("youtube-morphe-v*-all.apk", "Download"),
              "yt-morphe-zip": ("youtube-morphe-module-v*-all.zip", "Download"),
              "ytm-morphe-apk-arm64": ("youtube-music-morphe-v*-arm64-v8a.apk", "arm64-v8a"),
              "ytm-morphe-apk-armv7": ("youtube-music-morphe-v*-arm-v7a.apk", "arm-v7a"),
              "ytm-morphe-zip-arm64": ("youtube-music-morphe-module-v*-arm64-v8a.zip", "arm64-v8a"),
              "ytm-morphe-zip-armv7": ("youtube-music-morphe-module-v*-arm-v7a.zip", "arm-v7a"),
          }

          with open("README.md", encoding="utf-8") as f:
              readme = f.read()

          changed = False
          for marker, (pattern, label) in targets.items():
              matches = glob.glob(os.path.join("build", pattern))
              if not matches:
                  continue
              name = os.path.basename(matches[0])
              link = f"[{label or name}]({base}{name})"
              new_readme, n = re.subn(
                  rf"(<!--{marker}-->).*?(<!--/{marker}-->)",
                  lambda m: m.group(1) + link + m.group(2),
                  readme,
                  flags=re.DOTALL,
              )
              if n and new_readme != readme:
                  readme = new_readme
                  changed = True

          try:
              headers = {
                  "Accept": "application/vnd.github+json",
                  "User-Agent": "GitHub-Actions",
              }
              token = os.environ.get("GH_TOKEN", "")
              if token:
                  headers["Authorization"] = f"Bearer {token}"
              repo = os.environ.get("GITHUB_REPOSITORY", "")
              total_downloads = 0
              page = 1
              while True:
                  url = f"https://api.github.com/repos/{repo}/releases?per_page=100&page={page}"
                  req = urllib.request.Request(url, headers=headers)
                  with urllib.request.urlopen(req, timeout=15) as resp:
                      data = json.loads(resp.read().decode())
                  if not data:
                      break
                  for r in data:
                      for a in r.get("assets", []):
                          total_downloads += a.get("download_count", 0)
                  if len(data) < 100:
                      break
                  page += 1

              if total_downloads >= 1_000_000:
                  count_str = f"{total_downloads / 1_000_000:.1f}M"
              elif total_downloads >= 1_000:
                  count_str = f"{total_downloads / 1_000:.1f}k"
              else:
                  count_str = str(total_downloads)

              badge_link = f"https://img.shields.io/badge/downloads-{count_str}-success"
              new_readme, n = re.subn(
                  r"(<!--downloads-->).*?(<!--/downloads-->)",
                  rf"\g<1>[![Downloads]({badge_link})](../../releases)\g<2>",
                  readme,
                  flags=re.DOTALL,
              )
              if n and new_readme != readme:
                  readme = new_readme
                  changed = True
          except Exception as e:
              print(f"Warning: could not update download count badge: {e}")

          if changed:
              with open("README.md", "w", encoding="utf-8") as f:
                  f.write(readme)
              print("README.md updated")
          else:
              print("No README changes needed")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          if ! git diff --cached --quiet; then
            git commit -m "Update README download links"
            git push origin HEAD:main
          else
            echo "no changes!"
          fi

      - name: Update modules changelog and update json
        id: update_config
        if: ${{ inputs.only_apps || steps.cfg.outputs.should_build != 'false' }}
        run: |
          git checkout -f update || git switch --discard-changes --orphan update
          cp -f build.tmp build.md
          cp -f state.tmp state.md
          get_update_json() {
            echo "{
            \"version\": \"$1\",
            \"versionCode\": ${{ steps.next_ver_code.outputs.NEXT_VER_CODE }},
            \"zipUrl\": \"$2\",
            \"changelog\": \"https://raw.githubusercontent.com/$GITHUB_REPOSITORY/update/build.md\"
          }"
          }

          cd build || { echo "build folder not found"; exit 1; }
          for OUTPUT in *module*.zip; do
            [ "$OUTPUT" = "*module*.zip" ] && continue
            ZIP_S=$(unzip -p "$OUTPUT" module.prop)
            if ! UPDATE_JSON=$(echo "$ZIP_S" | grep updateJson); then continue; fi
            UPDATE_JSON="${UPDATE_JSON##*/}"
            VER=$(echo "$ZIP_S" | grep version=)
            VER="${VER##*=}"
            DLURL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/${{ steps.next_ver_code.outputs.NEXT_VER_CODE }}/${OUTPUT}"
            get_update_json "$VER" "$DLURL" >"../$UPDATE_JSON"
          done
          cd ..

          find . -name "*-update.json" | grep . || : >dummy-update.json

      - name: Commit module json changes
        if: ${{ inputs.only_apps || steps.cfg.outputs.should_build != 'false' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      
          git add build.md state.md *-update.json
      
          if ! git diff --cached --quiet; then
            git commit -m "Bump version ${{ steps.next_ver_code.outputs.NEXT_VER_CODE }}"
            git push origin HEAD:update
          else
            echo "no changes!"
          fi

      - name: Report to Telegram
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
        if: env.TG_TOKEN != null && (inputs.only_apps || steps.cfg.outputs.should_build != 'false')
        run: |
          cd build || { echo "build folder not found"; exit 1; }

          TG_CHAT="@rvc_magisk"
          NL=$'\n'
          APKS=""
          MODULES=""
          for OUTPUT in *; do
            DL_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/${{ steps.next_ver_code.outputs.NEXT_VER_CODE }}/${OUTPUT}"
            if [[ $OUTPUT = *.apk ]]; then
              APKS+="${NL}??[${OUTPUT}](${DL_URL})"
            elif [[ $OUTPUT = *.zip ]]; then
              MODULES+="${NL}??[${OUTPUT}](${DL_URL})"
            fi
          done
          MODULES=${MODULES#"$NL"}
          APKS=${APKS#"$NL"}

          BODY="$(sed 's/^\* \*\*/? \*\*/g; s/^\* `/? \*\*/g; s/`/\*/g; s/^\* /\?/g; s/\*\*/\*/g; s/###//g; s/^- /? /g; /^==/d;' ../build.md)"
          MSG="*New build!*

          ${BODY}

          *  Download Links:*
          Modules:
          ${MODULES}

          APKs:
          ${APKS}"

          curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d "chat_id=${TG_CHAT}" \
            -d "parse_mode=Markdown" \
            -d "disable_web_page_preview=true" \
            -d "text=${MSG}"
