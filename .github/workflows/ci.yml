name: CI
on:
  workflow_dispatch:
    inputs:
      only_apps:
        description: Comma separated list of apps to build (e.g. YouTube-Morphe, YouTube-Extended)
        required: false
        type: string
  schedule:
    - cron: "23 20 * * *"

jobs:
  cleanup:
    permissions: write-all
    runs-on: ubuntu-latest
    steps:
      - name: Clear older runs and caches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh run list -L400 --json databaseId -q '.[].databaseId' | tail -n+10 | xargs -IID gh api "repos/$GITHUB_REPOSITORY/actions/runs/ID" -X DELETE || :
          gh api -H "Accept: application/vnd.github+json" "repos/$GITHUB_REPOSITORY/actions/caches" -q '.actions_caches[].id' | tail -n+4 | xargs -IID gh api "repos/$GITHUB_REPOSITORY/actions/caches/ID" -X DELETE || :

  # build.yml decides for itself (via its "Update config" step and state.md)
  # whether anything actually needs rebuilding, and no-ops if not - so this
  # just calls it unconditionally instead of keeping a second, easily
  # out-of-sync copy of that same "should we build?" check here.
  build:
    permissions: write-all
    uses: ./.github/workflows/build.yml
    with:
      only_apps: ${{ inputs.only_apps }}
    secrets: inherit
